<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.2" />
    </linearGradient>
  </defs>

  <!-- Rounded App Background -->
  <rect width="512" height="512" rx="115" fill="url(#bg)" />

  <!-- Inner Soft Glow Border -->
  <rect x="16" y="16" width="480" height="480" rx="100" fill="none" stroke="url(#glow)" stroke-width="4" />

  <!-- Globe / Multilingual Graphics -->
  <g transform="translate(256, 256)">
    <!-- Globe outline -->
    <circle r="150" fill="none" stroke="#ffffff" stroke-width="16" opacity="0.9" />
    <ellipse rx="75" ry="150" fill="none" stroke="#ffffff" stroke-width="14" opacity="0.7" />
    <line x1="-150" y1="0" x2="150" y2="0" stroke="#ffffff" stroke-width="14" opacity="0.7" />
    <line x1="-128" y1="-75" x2="128" y2="-75" stroke="#ffffff" stroke-width="12" opacity="0.5" />
    <line x1="-128" y1="75" x2="128" y2="75" stroke="#ffffff" stroke-width="12" opacity="0.5" />

    <!-- Language translation badge symbols -->
    <circle cx="95" cy="95" r="55" fill="#10b981" stroke="#ffffff" stroke-width="8" />
    <text x="95" y="108" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="900" fill="#ffffff" text-anchor="middle">A</text>

    <circle cx="-95" cy="-95" r="55" fill="#f59e0b" stroke="#ffffff" stroke-width="8" />
    <text x="-95" y="-83" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="32" font-weight="900" fill="#ffffff" text-anchor="middle">文</text>
  </g>
</svg>
